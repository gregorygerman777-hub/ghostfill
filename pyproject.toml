[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solpaper"
version = "0.1.0"
description = "Paper trading service for Solana token strategies on live mainnet market data. Simulation only."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=12",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "pydantic>=2.6,<3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
solpaper = "solpaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solpaper.service" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
