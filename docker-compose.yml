# Paper trading only. RPC_URL is read from your shell or a local .env file at
# runtime and is never baked into the image.
name: ghostfill

services:
  ghostfill:
    build: .
    image: ghostfill:0.1.0
    restart: unless-stopped
    environment:
      RPC_URL: ${RPC_URL:?set RPC_URL to a Solana mainnet RPC endpoint}
      WS_URL: ${WS_URL:-}
      GHOSTFILL_CONFIG: /app/config/${GHOSTFILL_CONFIG_FILE:-config.yaml}
    volumes:
      - ghostfill-data:/data
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"   # status API on localhost only
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # One-off backtest: docker compose run --rm backtest
  backtest:
    image: ghostfill:0.1.0
    build: .
    profiles: ["tools"]
    environment:
      GHOSTFILL_CONFIG: /app/config/${GHOSTFILL_CONFIG_FILE:-config.yaml}
    volumes:
      - ghostfill-data:/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    command: ["backtest"]

volumes:
  ghostfill-data:
